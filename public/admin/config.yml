backend:
  name: github
  repo: bimengineer34-ops/akort-website
  branch: main
  # Must match PUBLIC_SITE_URL in .env and the GitHub OAuth App's callback URL.
  base_url: https://www.akortmuhendislik.com
  auth_endpoint: oauth/auth

media_folder: 'src/assets/images'
public_folder: '~/assets/images'

collections:
  # ---------------------------------------------------------------------
  # Bilgi Merkezi (blog) posts
  # ---------------------------------------------------------------------
  - name: 'post'
    label: 'Bilgi Merkezi Yazıları'
    folder: 'src/data/post'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Başlık', name: 'title', widget: 'string' }
      - { label: 'Özet', name: 'excerpt', widget: 'text', required: false }
      - { label: 'Görsel', name: 'image', widget: 'image', required: false }
      - { label: 'Görsel Alt Metni', name: 'imageAlt', widget: 'string', required: false }
      - { label: 'Kategori', name: 'category', widget: 'string', required: false, hint: 'Örn. BIM, Enerji, MEP' }
      - {
          label: 'Etiketler',
          name: 'tags',
          widget: 'list',
          allow_add: true,
          required: false,
          field: { label: 'Etiket', name: 'tag', widget: 'string' },
        }
      - { label: 'Yazar', name: 'author', widget: 'string', required: false }
      - { label: 'Yayın Tarihi', name: 'publishDate', widget: 'datetime', required: false }
      - { label: 'Taslak (yayınlanmasın)', name: 'draft', widget: 'boolean', required: false, default: false }
      - { label: 'İçerik', name: 'body', widget: 'markdown' }

  # ---------------------------------------------------------------------
  # Projeler
  # ---------------------------------------------------------------------
  - name: 'project'
    label: 'Projeler'
    folder: 'src/data/project'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Proje Adı', name: 'title', widget: 'string' }
      - { label: 'Kısa Özet', name: 'excerpt', widget: 'text', required: false }
      - { label: 'Görsel', name: 'image', widget: 'image', required: false }
      - { label: 'Görsel Alt Metni', name: 'imageAlt', widget: 'string', required: false }
      - {
          label: 'Kategoriler (filtre etiketleri)',
          name: 'tags',
          widget: 'select',
          multiple: true,
          options: ['Mekanik', 'Elektrik', 'BIM', 'Enerji', 'GES', 'Yapı', 'Çelik', 'Taahhüt'],
        }
      - {
          label: 'İşveren',
          name: 'client',
          widget: 'string',
          required: false,
          hint: 'Gizliyse: "Gizlilik politikası gereği paylaşılmamaktadır"',
        }
      - { label: 'Lokasyon', name: 'location', widget: 'string', required: false }
      - { label: 'Yıl', name: 'year', widget: 'string', required: false }
      - { label: 'Alan', name: 'area', widget: 'string', required: false }
      - { label: 'Hizmet Kapsamı', name: 'scope', widget: 'text', required: false }
      - { label: 'Projenin İhtiyacı', name: 'need', widget: 'text', required: false }
      - { label: "AKORT'un Çözümü", name: 'solution', widget: 'text', required: false }
      - {
          label: 'Uygulanan Sistemler',
          name: 'systems',
          widget: 'list',
          required: false,
          field: { label: 'Sistem', name: 'item', widget: 'string' },
        }
      - {
          label: 'Proje Çıktıları',
          name: 'outcomes',
          widget: 'list',
          required: false,
          field: { label: 'Çıktı', name: 'item', widget: 'string' },
        }
      - { label: 'Taslak (yayınlanmasın)', name: 'draft', widget: 'boolean', required: false, default: false }
      - { label: 'Proje Anlatımı', name: 'body', widget: 'markdown', required: false }

  # ---------------------------------------------------------------------
  # Menüler, footer ve iletişim bilgileri (src/navigation.data.yaml)
  # ---------------------------------------------------------------------
  - name: 'navigation'
    label: 'Menüler & İletişim'
    files:
      - name: 'main'
        label: 'Menüler, Footer ve İletişim Bilgileri'
        file: 'src/navigation.data.yaml'
        fields:
          - label: 'Üst Menü'
            name: 'header'
            widget: 'object'
            fields:
              - label: 'Menü Öğeleri'
                name: 'links'
                widget: 'list'
                fields:
                  - { label: 'Metin', name: 'text', widget: 'string' }
                  - { label: 'Adres (alt menüsü yoksa)', name: 'href', widget: 'string', required: false }
                  - label: 'Alt Menü Öğeleri (varsa)'
                    name: 'links'
                    widget: 'list'
                    required: false
                    fields:
                      - { label: 'Metin', name: 'text', widget: 'string' }
                      - { label: 'Adres', name: 'href', widget: 'string' }
              - label: 'Sağ Üstteki Buton(lar)'
                name: 'actions'
                widget: 'list'
                fields:
                  - { label: 'Metin', name: 'text', widget: 'string' }
                  - { label: 'Adres', name: 'href', widget: 'string' }
          - label: 'Footer (Alt Bilgi)'
            name: 'footer'
            widget: 'object'
            fields:
              - label: 'Sütunlar'
                name: 'links'
                widget: 'list'
                fields:
                  - { label: 'Başlık', name: 'title', widget: 'string' }
                  - label: 'Bağlantılar'
                    name: 'links'
                    widget: 'list'
                    fields:
                      - { label: 'Metin', name: 'text', widget: 'string' }
                      - { label: 'Adres', name: 'href', widget: 'string' }
              - label: 'Alt Satır Yasal Bağlantılar'
                name: 'secondaryLinks'
                widget: 'list'
                fields:
                  - { label: 'Metin', name: 'text', widget: 'string' }
                  - { label: 'Adres', name: 'href', widget: 'string' }
              - label: 'Sosyal Medya İkonları'
                name: 'socialLinks'
                widget: 'list'
                fields:
                  - { label: 'Erişilebilirlik Etiketi', name: 'ariaLabel', widget: 'string' }
                  - { label: 'İkon (tabler:...)', name: 'icon', widget: 'string' }
                  - { label: 'Adres', name: 'href', widget: 'string' }
              - {
                  label: 'Telif Hakkı Metni',
                  name: 'footNote',
                  widget: 'string',
                  hint: '{year} yazarsanız otomatik olarak güncel yıl ile değiştirilir.',
                }
          - label: 'İletişim Bilgileri'
            name: 'contact'
            widget: 'object'
            fields:
              - { label: 'Telefon', name: 'phone', widget: 'string' }
              - { label: 'E-posta', name: 'email', widget: 'string' }
              - { label: 'Adres', name: 'address', widget: 'string' }
              - { label: 'LinkedIn', name: 'linkedin', widget: 'string', required: false }
              - { label: 'Instagram', name: 'instagram', widget: 'string', required: false }

  # ---------------------------------------------------------------------
  # Site adı, açıklama ve SEO ayarları (src/config.yaml)
  # Not: apps.blog / i18n / ui gibi teknik ayarlar bilinçli olarak burada
  # değil — panelden yanlışlıkla değiştirilirse site URL yapısı bozulabilir.
  # ---------------------------------------------------------------------
  - name: 'settings'
    label: 'Site Ayarları & SEO'
    files:
      - name: 'general'
        label: 'Genel Ayarlar & SEO'
        file: 'src/config.yaml'
        fields:
          - label: 'Site'
            name: 'site'
            widget: 'object'
            fields:
              - { label: 'Site Adı', name: 'name', widget: 'string' }
              - { label: 'Site Adresi (URL)', name: 'site', widget: 'string' }
              - {
                  label: 'Google Site Doğrulama Kodu',
                  name: 'googleSiteVerificationId',
                  widget: 'string',
                  required: false,
                }
          - label: 'SEO / Metadata'
            name: 'metadata'
            widget: 'object'
            fields:
              - label: 'Başlık'
                name: 'title'
                widget: 'object'
                fields:
                  - { label: 'Varsayılan Başlık', name: 'default', widget: 'string' }
                  - { label: 'Başlık Şablonu (%s sayfa başlığı yerine geçer)', name: 'template', widget: 'string' }
              - { label: 'Varsayılan Açıklama (meta description)', name: 'description', widget: 'text' }
          - label: 'Analytics'
            name: 'analytics'
            widget: 'object'
            required: false
            fields:
              - label: 'Vendors'
                name: 'vendors'
                widget: 'object'
                fields:
                  - label: 'Google Analytics'
                    name: 'googleAnalytics'
                    widget: 'object'
                    fields:
                      - { label: 'Measurement ID (G-XXXXXXXXXX)', name: 'id', widget: 'string', required: false }
