services:
  astrowind:
    build: .
    container_name: astrowind
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    expose:
      - '4321'

  # Public entry point: automatic HTTPS (Let's Encrypt) for the domain, then
  # routes everything to the app. See ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: akort-caddy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - astrowind

volumes:
  caddy_data:
  caddy_config:
